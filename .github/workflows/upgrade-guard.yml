name: Upgrade guard
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  apt:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update
      - run: apt-get install -y perl
      - run: prove -v test/upgrade-guard.t
        env:
          PVE_OVERLAY_APT_TEST: "1"
